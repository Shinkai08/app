<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成员 Members</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #06080f;
      --bg-mid:     #0c1120;
      --bg-panel:   rgba(14, 22, 44, 0.72);
      --accent:     #4f9dff;
      --accent-2:   #a78bfa;
      --gold:       #fbbf24;
      --text-main:  #e8edf8;
      --text-sub:   #8fa8c8;
      --card-border: rgba(79, 157, 255, 0.18);
      --glow:       0 0 24px rgba(79,157,255,0.25);
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
    }

    /* ── canvas stars ── */
    #stars-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }

    /* ── subtle grid overlay ── */
    .grid-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(79,157,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,157,255,.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── radial glow blobs ── */
    .blob {
      position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
    }
    .blob-1 { width: 600px; height: 600px; background: rgba(79,157,255,.12); top: -150px; left: -100px; }
    .blob-2 { width: 500px; height: 500px; background: rgba(167,139,250,.10); bottom: -120px; right: -80px; }
    .blob-3 { width: 300px; height: 300px; background: rgba(251,191,36,.07); top: 40%; left: 50%; transform: translateX(-50%); }

    /* ── layout ── */
    .page {
      position: relative; z-index: 1;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      padding: 40px 60px 30px;
    }

    /* ── header ── */
    .header {
      display: flex; align-items: center; gap: 28px;
      margin-bottom: 36px;
    }
    .header-title {
      display: flex; align-items: baseline; gap: 12px;
    }
    .header-title .cn {
      font-size: 2.4rem; font-weight: 700;
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(120deg, #e8edf8 20%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .header-title .en {
      font-size: 1.0rem; font-weight: 300; color: var(--text-sub);
      letter-spacing: 6px; text-transform: uppercase;
    }
    .header-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(79,157,255,.4), transparent);
    }

    /* ── team toggle ── */
    .team-toggle {
      display: flex; align-items: center;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--card-border);
      border-radius: 100px;
      padding: 4px;
      backdrop-filter: blur(10px);
    }
    .team-toggle button {
      position: relative; cursor: pointer; border: none;
      background: transparent;
      color: var(--text-sub);
      font-family: inherit; font-size: .8rem; font-weight: 500;
      padding: 6px 20px; border-radius: 100px;
      letter-spacing: 1px;
      transition: color .3s;
      z-index: 1;
    }
    .team-toggle button.active { color: #fff; }
    .toggle-pill {
      position: absolute;
      height: calc(100% - 8px); border-radius: 100px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 14px rgba(79,157,255,.5);
      transition: transform .35s cubic-bezier(.4,0,.2,1), width .35s cubic-bezier(.4,0,.2,1);
      pointer-events: none; z-index: 0;
      top: 4px; left: 4px;
    }

    /* ── main content ── */
    .content {
      flex: 1; display: flex; align-items: flex-start; gap: 0;
      min-height: 0;
    }

    /* ── member list ── */
    .member-section {
      display: flex; align-items: center; gap: 0;
      position: relative;
    }
    .member-list {
      display: flex; flex-direction: column; gap: 14px;
      width: 480px;
    }

    .member-card {
      display: flex; align-items: center; gap: 18px;
      padding: 14px 20px 14px 14px;
      border-radius: 100px;
      border: 1px solid var(--card-border);
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform .3s cubic-bezier(.4,0,.2,1),
                  border-color .3s,
                  box-shadow .3s;
      animation: slideInLeft .5s cubic-bezier(.4,0,.2,1) both;
    }
    .member-card:nth-child(1) { animation-delay: .05s; }
    .member-card:nth-child(2) { animation-delay: .12s; }
    .member-card:nth-child(3) { animation-delay: .19s; }
    .member-card:nth-child(4) { animation-delay: .26s; }
    .member-card:nth-child(5) { animation-delay: .33s; }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .member-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(79,157,255,.06), transparent);
      opacity: 0; transition: opacity .3s;
    }
    .member-card:hover::before,
    .member-card.active::before { opacity: 1; }
    .member-card:hover,
    .member-card.active {
      transform: translateX(6px);
      border-color: rgba(79,157,255,.45);
      box-shadow: var(--glow), inset 0 0 0 1px rgba(79,157,255,.1);
    }
    .member-card.active {
      border-color: rgba(79,157,255,.65);
      box-shadow: 0 0 32px rgba(79,157,255,.3), inset 0 0 0 1px rgba(79,157,255,.18);
    }

    /* shimmer on active */
    .member-card.active::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
      animation: shimmer 2.5s infinite;
    }
    @keyframes shimmer {
      to { left: 160%; }
    }

    /* avatar */
    .avatar {
      width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid rgba(79,157,255,.3);
      background: var(--bg-deep);
      overflow: hidden; position: relative;
      transition: border-color .3s;
    }
    .member-card.active .avatar,
    .member-card:hover .avatar { border-color: var(--accent); }

    .avatar-img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .avatar-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 700; color: var(--accent);
      background: radial-gradient(circle at 40% 40%, rgba(79,157,255,.15), transparent 70%);
    }

    /* rank badge */
    .rank-badge {
      position: absolute; top: -2px; right: -2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      border: 1.5px solid var(--bg-deep);
      display: flex; align-items: center; justify-content: center;
      font-size: .55rem; font-weight: 700; color: #000;
      box-shadow: 0 0 8px rgba(251,191,36,.5);
    }

    .member-info { flex: 1; min-width: 0; }
    .member-name {
      font-size: .92rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text-main);
      letter-spacing: .5px;
    }
    .member-role {
      font-size: .72rem; color: var(--accent);
      font-weight: 500; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 3px;
    }
    .member-bio {
      font-size: .72rem; color: var(--text-sub);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-weight: 300;
    }

    /* tags */
    .member-tags {
      display: flex; gap: 5px; flex-shrink: 0;
    }
    .tag {
      font-size: .62rem; font-weight: 500;
      padding: 2px 8px; border-radius: 100px;
      border: 1px solid;
      letter-spacing: .5px;
    }
    .tag-blue  { color: var(--accent);  border-color: rgba(79,157,255,.3); background: rgba(79,157,255,.08); }
    .tag-purple{ color: var(--accent-2); border-color: rgba(167,139,250,.3); background: rgba(167,139,250,.08); }
    .tag-gold  { color: var(--gold);    border-color: rgba(251,191,36,.3);  background: rgba(251,191,36,.08); }

    /* ── connector arc (SVG) ── */
    .connector {
      width: 50px; flex-shrink: 0; align-self: stretch;
      display: flex; align-items: center;
      opacity: .55;
    }
    .connector svg { height: 100%; }

    /* ── detail panel ── */
    .detail-panel {
      flex: 1; display: flex; align-items: center;
      padding: 0 40px;
      min-height: 0;
    }
    .detail-card {
      width: 100%; max-width: 340px;
      background: var(--bg-panel);
      border: 1px solid var(--card-border);
      border-radius: 24px; padding: 32px 28px;
      backdrop-filter: blur(20px);
      box-shadow: var(--glow);
      animation: fadeUp .45s cubic-bezier(.4,0,.2,1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .detail-avatar-wrap {
      display: flex; justify-content: center; margin-bottom: 20px;
    }
    .detail-avatar {
      width: 90px; height: 90px; border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px rgba(79,157,255,.35);
      overflow: hidden; background: var(--bg-deep);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: var(--accent);
    }
    .detail-name {
      text-align: center; font-size: 1.2rem; font-weight: 700;
      margin-bottom: 4px; color: var(--text-main);
    }
    .detail-role {
      text-align: center; font-size: .78rem;
      color: var(--accent); letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .detail-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-border), transparent);
      margin-bottom: 16px;
    }
    .detail-bio {
      font-size: .82rem; color: var(--text-sub); line-height: 1.7;
      margin-bottom: 18px; font-weight: 300;
    }
    .detail-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-item {
      background: rgba(79,157,255,.05);
      border: 1px solid rgba(79,157,255,.1);
      border-radius: 10px; padding: 10px 12px;
    }
    .stat-label { font-size: .65rem; color: var(--text-sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
    .stat-value { font-size: .92rem; font-weight: 600; color: var(--text-main); }

    /* ── character figure ── */
    .character-wrap {
      position: relative; flex-shrink: 0;
      width: 340px; align-self: flex-end;
      animation: floatUp .6s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes floatUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .character-glow {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 260px; height: 80px; border-radius: 50%;
      background: radial-gradient(ellipse, rgba(79,157,255,.25), transparent 70%);
      filter: blur(12px);
    }
    .character-img {
      width: 100%; display: block;
      filter: drop-shadow(0 8px 40px rgba(79,157,255,.18));
      animation: charFloat 4s ease-in-out infinite;
    }
    @keyframes charFloat {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* decorative corner accent */
    .corner-accent {
      position: absolute;
      width: 120px; height: 120px;
      border-top: 1.5px solid rgba(79,157,255,.25);
      border-left: 1.5px solid rgba(79,157,255,.25);
      border-radius: 4px 0 0 0;
      top: 32px; left: 44px;
      pointer-events: none;
    }

    /* ── footer count bar ── */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(79,157,255,.08);
      font-size: .72rem; color: var(--text-sub);
    }
    .count-dots { display: flex; gap: 6px; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(79,157,255,.25);
      transition: background .3s, transform .3s;
    }
    .dot.active { background: var(--accent); transform: scale(1.4); }

    /* ── transitions for team switch ── */
    .member-list.switching {
      animation: switchOut .2s forwards;
    }
    @keyframes switchOut {
      to { opacity: 0; transform: translateX(-16px); }
    }
    .member-list.switched-in {
      animation: switchIn .3s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes switchIn {
      from { opacity: 0; transform: translateX(16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(79,157,255,.2); border-radius: 2px; }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="corner-accent"></div>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">
      <span class="cn">成员</span>
      <span class="en">Members</span>
    </div>
    <div class="header-line"></div>
    <div class="team-toggle" id="teamToggle">
      <div class="toggle-pill" id="togglePill"></div>
      <button class="btn-team" data-team="americas">美洲队</button>
      <button class="btn-team active" data-team="asia">亚洲队</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- MEMBER LIST + CONNECTOR -->
    <div class="member-section">
      <div class="member-list" id="memberList">
        <!-- cards injected by JS -->
      </div>

      <!-- SVG arc connector -->
      <div class="connector">
        <svg viewBox="0 0 50 400" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <defs>
            <linearGradient id="arcGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#4f9dff" stop-opacity="0"/>
              <stop offset="40%"  stop-color="#4f9dff" stop-opacity="0.7"/>
              <stop offset="60%"  stop-color="#a78bfa" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M 5 20 Q 45 200 5 380" stroke="url(#arcGrad)" stroke-width="1.5" fill="none"/>
          <!-- tick marks -->
          <line x1="5" y1="60"  x2="15" y2="60"  stroke="#4f9dff" stroke-opacity=".4" stroke-width="1"/>
          <line x1="5" y1="136" x2="15" y2="136" stroke="#4f9dff" stroke-opacity=".4" stroke-width="1"/>
          <line x1="5" y1="206" x2="15" y2="206" stroke="#a78bfa" stroke-opacity=".4" stroke-width="1"/>
          <line x1="5" y1="276" x2="15" y2="276" stroke="#a78bfa" stroke-opacity=".4" stroke-width="1"/>
          <line x1="5" y1="340" x2="15" y2="340" stroke="#a78bfa" stroke-opacity=".3" stroke-width="1"/>
        </svg>
      </div>
    </div>

    <!-- DETAIL PANEL -->
    <div class="detail-panel" id="detailPanel">
      <!-- injected by JS -->
    </div>

    <!-- CHARACTER -->
    <div class="character-wrap">
      <div class="character-glow"></div>
      <svg class="character-img" viewBox="0 0 280 520" xmlns="http://www.w3.org/2000/svg">
        <!-- stylized silhouette of an elegant character in yukata -->
        <defs>
          <radialGradient id="skinGrad" cx="50%" cy="35%" r="50%">
            <stop offset="0%" stop-color="#fde8d8"/>
            <stop offset="100%" stop-color="#f4c8a8"/>
          </radialGradient>
          <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6b4c2a"/>
            <stop offset="100%" stop-color="#3d2a10"/>
          </radialGradient>
          <linearGradient id="kimono" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5ba4cf"/>
            <stop offset="100%" stop-color="#3a7fbf"/>
          </linearGradient>
          <linearGradient id="kimonoShad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4f9dff" stop-opacity=".12"/>
            <stop offset="100%" stop-color="#4f9dff" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- body / kimono -->
        <ellipse cx="140" cy="420" rx="85" ry="110" fill="url(#kimono)"/>
        <!-- kimono pattern dots -->
        <g fill="white" fill-opacity=".18">
          <circle cx="110" cy="380" r="9"/><circle cx="160" cy="360" r="8"/>
          <circle cx="130" cy="410" r="7"/><circle cx="180" cy="400" r="9"/>
          <circle cx="105" cy="440" r="7"/><circle cx="165" cy="445" r="8"/>
          <circle cx="145" cy="470" r="6"/><circle cx="120" cy="470" r="7"/>
        </g>
        <!-- obi / sash -->
        <rect x="90" y="360" width="100" height="28" rx="4" fill="#9b2c2c" opacity=".9"/>
        <rect x="90" y="365" width="100" height="6"  rx="2" fill="rgba(255,255,255,.12)"/>

        <!-- arms -->
        <ellipse cx="85"  cy="350" rx="16" ry="46" fill="url(#kimono)" transform="rotate(-10 85 350)"/>
        <ellipse cx="195" cy="355" rx="16" ry="42" fill="url(#kimono)" transform="rotate(12 195 355)"/>
        <!-- hands -->
        <ellipse cx="78"  cy="392" rx="11" ry="13" fill="url(#skinGrad)"/>
        <ellipse cx="200" cy="393" rx="11" ry="13" fill="url(#skinGrad)"/>

        <!-- neck -->
        <rect x="128" y="278" width="24" height="34" rx="10" fill="url(#skinGrad)"/>

        <!-- head -->
        <ellipse cx="140" cy="248" rx="52" ry="58" fill="url(#skinGrad)"/>

        <!-- hair back -->
        <ellipse cx="140" cy="232" rx="56" ry="62" fill="#1a1014"/>
        <ellipse cx="140" cy="248" rx="52" ry="58" fill="url(#skinGrad)"/>

        <!-- hair front / bangs -->
        <path d="M88 220 Q90 170 140 168 Q190 170 192 220 Q180 190 140 188 Q100 190 88 220Z" fill="#1a1014"/>
        <path d="M88 220 Q80 235 84 250 Q92 200 105 210Z" fill="#1a1014"/>
        <path d="M192 220 Q200 235 196 250 Q188 200 175 210Z" fill="#1a1014"/>
        <!-- hair highlight -->
        <path d="M115 175 Q130 168 145 172" stroke="rgba(255,255,255,.18)" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- eyes -->
        <ellipse cx="120" cy="252" rx="13" ry="10" fill="url(#eyeGrad)"/>
        <ellipse cx="160" cy="252" rx="13" ry="10" fill="url(#eyeGrad)"/>
        <ellipse cx="120" cy="252" rx="7"  ry="8"  fill="#2c1a08"/>
        <ellipse cx="160" cy="252" rx="7"  ry="8"  fill="#2c1a08"/>
        <!-- eye shine -->
        <ellipse cx="124" cy="249" rx="3" ry="3" fill="rgba(255,255,255,.85)" filter="url(#glow)"/>
        <ellipse cx="164" cy="249" rx="3" ry="3" fill="rgba(255,255,255,.85)" filter="url(#glow)"/>
        <!-- eyelashes -->
        <path d="M107 248 Q113 240 120 245" stroke="#1a0808" stroke-width="1.5" fill="none"/>
        <path d="M147 248 Q153 240 160 245" stroke="#1a0808" stroke-width="1.5" fill="none"/>

        <!-- eyebrows -->
        <path d="M108 238 Q120 233 132 236" stroke="#2a1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M148 236 Q160 233 172 238" stroke="#2a1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- nose -->
        <path d="M138 268 Q140 273 142 268" stroke="#c9a080" stroke-width="1.2" fill="none" stroke-linecap="round"/>

        <!-- mouth -->
        <path d="M130 282 Q140 289 150 282" stroke="#c08060" stroke-width="1.8" fill="none" stroke-linecap="round"/>

        <!-- blush -->
        <ellipse cx="108" cy="268" rx="12" ry="7" fill="rgba(255,150,130,.22)"/>
        <ellipse cx="172" cy="268" rx="12" ry="7" fill="rgba(255,150,130,.22)"/>

        <!-- light overlay -->
        <ellipse cx="140" cy="340" rx="90" ry="120" fill="url(#kimonoShad)"/>
      </svg>
    </div>

  </div><!-- /.content -->

  <!-- FOOTER -->
  <div class="footer">
    <span id="footerTeam">亚洲队 · <span id="footerCount">5</span> 名成员</span>
    <div class="count-dots" id="countDots"></div>
    <span id="footerSelected">—</span>
  </div>

</div><!-- /.page -->

<script>
/* ─── DATA ─── */
const teams = {
  asia: [
    {
      id: 'a1', initial: '桃', name: '山田 桃子', nameEn: 'Momoko Yamada',
      role: '队长 / Captain', rank: 1,
      bio: '经验丰富的领队，擅长整体战略布局与团队协调，赛场上冷静果断。',
      stats: [
        { label: 'Rating', value: '2,840' }, { label: 'Wins',   value: '128' },
        { label: 'Region', value: 'JP/KR'  }, { label: 'Since',  value: '2019' },
      ],
      tags: [{ cls: 'tag-gold', text: 'MVP' }, { cls: 'tag-blue', text: 'IGL' }],
    },
    {
      id: 'a2', initial: '凛', name: '铃木 凛', nameEn: 'Rin Suzuki',

/* ─── STATE ─── */
let currentTeam = 'asia';
let selectedId  = teams.asia[0].id;

/* ─── STARS CANVAS ─── */
(function initStars() {
  const canvas = document.getElementById('stars-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function createStars() {
    stars = Array.from({ length: 120 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.006,
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.a = Math.max(0.05, Math.min(1, s.a + s.da));
      if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); createStars(); });
  resize(); createStars(); draw();
})();

/* ─── RENDER ─── */
function buildCard(m) {
  const tagsHtml = m.tags.map(t => `<span class="tag ${t.cls}">${t.text}</span>`).join('');
  const rankHtml = m.rank ? `<div class="rank-badge">#${m.rank}</div>` : '';
  return `
    <div class="member-card ${m.id === selectedId ? 'active' : ''}" data-id="${m.id}">
      <div class="avatar">
        <div class="avatar-placeholder">${m.initial}</div>
        ${rankHtml}
      </div>
      <div class="member-info">
        <div class="member-role">${m.role}</div>
        <div class="member-name">${m.name}</div>
        <div class="member-bio">${m.bio}</div>
      </div>
      <div class="member-tags">${tagsHtml}</div>
    </div>`;
}

function buildDetail(m) {
  const statsHtml = m.stats.map(s =>
    `<div class="stat-item"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`
  ).join('');
  return `
    <div class="detail-card" key="${m.id}">
      <div class="detail-avatar-wrap">
        <div class="detail-avatar">${m.initial}</div>
      </div>
      <div class="detail-name">${m.name}</div>
      <div class="detail-role">${m.role}</div>
      <div class="detail-divider"></div>
      <div class="detail-bio">${m.bio}</div>
      <div class="detail-stats">${statsHtml}</div>
    </div>`;
}

function buildDots(count) {
  return Array.from({ length: count }, (_, i) => {
    const isActive = teams[currentTeam][i].id === selectedId;
    return `<div class="dot ${isActive ? 'active' : ''}"></div>`;
  }).join('');
}

function render() {
  const list   = document.getElementById('memberList');
  const detail = document.getElementById('detailPanel');
  const dots   = document.getElementById('countDots');
  const sel    = teams[currentTeam].find(m => m.id === selectedId);

  list.innerHTML   = teams[currentTeam].map(buildCard).join('');
  detail.innerHTML = buildDetail(sel);
  dots.innerHTML   = buildDots(teams[currentTeam].length);

  document.getElementById('footerTeam').innerHTML =
    (currentTeam === 'asia' ? '亚洲队' : '美洲队') +
    ` · <span id="footerCount">${teams[currentTeam].length}</span> 名成员`;
  document.getElementById('footerSelected').textContent = sel.nameEn;

  list.querySelectorAll('.member-card').forEach(card => {
    card.addEventListener('click', () => {
      selectedId = card.dataset.id;
      render();
    });
    card.addEventListener('mouseenter', () => {
      if (card.dataset.id !== selectedId) card.style.transform = 'translateX(6px)';
    });
    card.addEventListener('mouseleave', () => {
      if (card.dataset.id !== selectedId) card.style.transform = '';
    });
  });
}

/* ─── TEAM TOGGLE ─── */
(function initToggle() {
  const toggle  = document.getElementById('teamToggle');
  const pill    = document.getElementById('togglePill');
  const buttons = toggle.querySelectorAll('.btn-team');

  function movePill(btn) {
    const toggleRect = toggle.getBoundingClientRect();
    const btnRect    = btn.getBoundingClientRect();
    pill.style.width  = btnRect.width  + 'px';
    pill.style.transform = `translateX(${btnRect.left - toggleRect.left - 4}px)`;
  }

  // init pill position
  const activeBtn = toggle.querySelector('.active');
  requestAnimationFrame(() => movePill(activeBtn));

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.team === currentTeam) return;
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      movePill(btn);

      const list = document.getElementById('memberList');
      list.classList.add('switching');
      setTimeout(() => {
        list.classList.remove('switching');
        currentTeam = btn.dataset.team;
        selectedId  = teams[currentTeam][0].id;
        render();
        list.classList.add('switched-in');
        setTimeout(() => list.classList.remove('switched-in'), 350);
      }, 200);
    });
  });
})();

/* ─── INIT ─── */
render();
